# Every pull request, and every push to dev and main, must pass both jobs before it can merge.
# Pushes to dev also give the automatic dev → main release PR its checks (PRs opened by the
# release workflow can't trigger workflows themselves).
name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

# A new push to the same PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Where mongodb-memory-server keeps the mongod binary, so it's cached between runs.
  MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries

jobs:
  checks:
    name: Lint, types, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Cache the MongoDB binary
        uses: actions/cache@v6
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn lint
      - run: yarn typecheck
      - name: Unit tests
        run: yarn test
      - run: yarn build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Cache the MongoDB binary
        uses: actions/cache@v6
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - name: Cache Playwright's browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - name: Install Chromium and its system libraries
        run: npx playwright install --with-deps chromium
      # Built here rather than inside Playwright's web server, so a slow build can't time it out.
      - run: yarn build
      - name: End-to-end tests (desktop and phone)
        run: yarn e2e
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
